<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Supermarket | Shopping Cart</title>
<link rel="stylesheet" href="supermarket-website_css_style_Version2.css">
        <script src="js_script_Version2.js" defer></script>
</head>
<body>

    <header>
        <h1>🛒 MY SUPERMARKET</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="product.html">Products</a>
            <a href="cart_Version2.html">Cart 🛒</a>
        </nav>
    </header>

    <main class="container">
        <h2>My Shopping Cart</h2>

        <div id="cart-items">
            <!-- Cart products appear here -->
        </div>

        <h3 id="cart-total">Total: KSh 0</h3>

        <button type="button" onclick="clearCart()">Clear Cart</button>
        <button type="button" onclick="checkout()">Proceed to Checkout</button>

        <dialog id="checkout-dialog" class="checkout-dialog" aria-labelledby="checkout-title">
            <form id="checkout-form" class="checkout-form">
                <button class="dialog-close" type="button" aria-label="Close checkout" onclick="closeCheckout()">×</button>
                <p class="eyebrow">Secure M-Pesa checkout</p>
                <h2 id="checkout-title">Almost yours.</h2>
                <p class="checkout-intro">Enter your Kenyan mobile number and we&apos;ll send an STK Push to your phone.</p>
                <label for="checkout-phone">M-Pesa phone number</label>
                <input id="checkout-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="0712 345 678" pattern="[+0-9() -]{9,18}" required>
                <p class="checkout-hint">Use a number that can receive an M-Pesa prompt.</p>
                <p id="checkout-status" class="checkout-status" role="status" aria-live="polite"></p>
                <button id="checkout-submit" class="checkout-submit" type="submit">Send payment request</button>
            </form>
        </dialog>
    </main>

    <footer>
        <p>© 2026 My Supermarket</p>
    </footer>

</body>
</html>
