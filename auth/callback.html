<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#063b76">
    <link rel="stylesheet" href="/supermarket-website_css_style_Version2.css">
    <link rel="stylesheet" href="/account.css">
    <script type="module" src="/js/auth-pages.js"></script>
    <title>Confirming account | MySupermarket</title>
  <script type="module" src="/js/store-branding.js"></script>
</head>
<body class="account-page" data-auth-page="callback">
    <header class="account-header"><a class="store-brand" href="/" aria-label="MySupermarket home"><img class="brand-mark" src="/app-icon-192.png" alt=""><span>My<span class="brand-accent">Supermarket</span></span></a></header>
    <main class="account-auth-layout auth-centered callback-layout">
        <section class="account-auth-card" aria-labelledby="auth-title">
            <a class="auth-logo" href="/" aria-label="MySupermarket home"><img src="/app-icon-192.png" alt=""></a>
            <p class="section-eyebrow">SECURE SIGN-IN</p>
            <h1 id="auth-title">Confirming your account</h1>
            <p class="auth-intro">Please wait while we securely complete your request.</p>
            <p class="auth-status" data-auth-status role="status" aria-live="polite" hidden></p>
            <a class="auth-submit auth-link-button" href="/login">Return to sign in</a>
        </section>
    </main>
</body>
</html>
